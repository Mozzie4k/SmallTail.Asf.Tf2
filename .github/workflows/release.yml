name: Build and Release DLL

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build SmallTail.Asf.Tf2/SmallTail.Asf.Tf2/SmallTail.Asf.Tf2.csproj -c Release -o ./out

      - name: Save DLL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallTail.Asf.Tf2
          path: ./out/SmallTail.Asf.Tf2.dll

      - name: Upload DLL to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./out/SmallTail.Asf.Tf2.dll --clobber
